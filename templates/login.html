{% extends "base.html" %}
{% block titulo %}Ingresar · CE Consultores{% endblock %}
{% block contenido %}
<div class="tarjeta">
  <h1>Ingresar</h1>
  {% if error %}<div class="rechazo" role="alert">{{ error }}</div>{% endif %}
  <form method="post" novalidate>
    <input type="hidden" name="next" value="{{ siguiente }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email }}" autocomplete="email">
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <button type="submit">Ingresar</button>
  </form>
  <p>¿No tenés cuenta? <a class= "registrarme2" href="{{ url_for('clientes.registro') }}">Registrate</a></p>
</div>
{% endblock %}
