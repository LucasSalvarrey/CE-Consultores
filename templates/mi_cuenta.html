{% extends "base.html" %}
{% block titulo %}Mi cuenta · CE Consultores{% endblock %}
{% block contenido %}
<div class="tarjeta">
  <h1>Mi cuenta</h1>
  <dl>
    <dt>Nombre</dt><dd>{{ cliente.nombre }}</dd>
    <dt>DNI</dt><dd>{{ cliente.dni }}</dd>
    <dt>Email</dt><dd>{{ cliente.email }}</dd>
    <dt>Teléfono</dt><dd>{{ cliente.telefono }}</dd>
    <dt>Plan</dt><dd>{{ plan.nombre }}</dd>
  </dl>
  <p><a class="editar-perfil" href="{{ url_for('clientes.registro') }}">Editar mis datos</a></p>
</div>
{% endblock %}
